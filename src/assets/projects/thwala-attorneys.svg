<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C084FC"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  
  <!-- Scale of Justice -->
  <rect x="390" y="150" width="20" height="200" fill="url(#purple)"/>
  <rect x="300" y="140" width="200" height="20" rx="10" fill="url(#purple)"/>
  
  <!-- Left pan -->
  <ellipse cx="320" cy="280" rx="60" ry="20" fill="#C084FC" opacity="0.8"/>
  <line x1="320" y1="160" x2="320" y2="260" stroke="#C084FC" stroke-width="3"/>
  
  <!-- Right pan -->
  <ellipse cx="480" cy="250" rx="60" ry="20" fill="#EC4899" opacity="0.8"/>
  <line x1="480" y1="160" x2="480" y2="230" stroke="#EC4899" stroke-width="3"/>
  
  <!-- Base -->
  <rect x="350" y="350" width="100" height="20" rx="10" fill="url(#purple)"/>
  <polygon points="400,350 370,380 430,380" fill="url(#purple)"/>
  
  <!-- Document icons -->
  <rect x="150" y="200" width="80" height="100" rx="5" fill="#C084FC" opacity="0.3"/>
  <rect x="160" y="220" width="40" height="6" fill="white" opacity="0.5"/>
  <rect x="160" y="235" width="55" height="6" fill="white" opacity="0.5"/>
  <rect x="160" y="250" width="35" height="6" fill="white" opacity="0.5"/>
  
  <rect x="570" y="250" width="80" height="100" rx="5" fill="#EC4899" opacity="0.3"/>
  <rect x="580" y="270" width="40" height="6" fill="white" opacity="0.5"/>
  <rect x="580" y="285" width="55" height="6" fill="white" opacity="0.5"/>
  
  <text x="400" y="440" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Thwala Attorneys</text>
  <text x="400" y="475" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">Legal Case Management System</text>
</svg>
