<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  
  <!-- Hospital/Medical cross -->
  <rect x="350" y="150" width="100" height="200" rx="10" fill="url(#teal)"/>
  <rect x="300" y="200" width="200" height="100" rx="10" fill="url(#teal)"/>
  
  <!-- Heart icon -->
  <path d="M400 280 C380 250, 340 250, 340 290 C340 330, 400 370, 400 370 C400 370, 460 330, 460 290 C460 250, 420 250, 400 280" fill="#0A0A0F"/>
  
  <!-- Patient icons -->
  <circle cx="200" cy="200" r="25" fill="#10B981" opacity="0.5"/>
  <rect x="180" y="235" width="40" height="50" rx="10" fill="#10B981" opacity="0.5"/>
  
  <circle cx="600" cy="200" r="25" fill="#14B8A6" opacity="0.5"/>
  <rect x="580" y="235" width="40" height="50" rx="10" fill="#14B8A6" opacity="0.5"/>
  
  <!-- Clipboard -->
  <rect x="550" y="350" width="100" height="130" rx="5" fill="#1E1E2A" stroke="#10B981" stroke-width="2"/>
  <rect x="575" y="340" width="50" height="20" rx="5" fill="#10B981"/>
  <rect x="565" y="375" width="70" height="8" rx="4" fill="#10B981" opacity="0.5"/>
  <rect x="565" y="395" width="60" height="8" rx="4" fill="#10B981" opacity="0.5"/>
  <rect x="565" y="415" width="70" height="8" rx="4" fill="#10B981" opacity="0.5"/>
  <rect x="565" y="435" width="50" height="8" rx="4" fill="#10B981" opacity="0.5"/>
  
  <!-- Stethoscope hint -->
  <circle cx="180" cy="400" r="30" fill="none" stroke="#14B8A6" stroke-width="4"/>
  <path d="M150 400 Q130 350, 180 320" fill="none" stroke="#14B8A6" stroke-width="4"/>
  
  <text x="400" y="460" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Healthcare System</text>
  <text x="400" y="495" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">Primary Healthcare Management</text>
</svg>
