<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgyard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22C55E"/>
      <stop offset="100%" style="stop-color:#16A34A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgyard)"/>
  
  <!-- Main house/property icon -->
  <polygon points="400,80 220,180 580,180" fill="url(#greenGrad)"/>
  <rect x="250" y="180" width="300" height="180" fill="#22C55E" opacity="0.9"/>
  <rect x="340" y="250" width="70" height="110" fill="#0A0A0F" rx="5"/>
  <rect x="280" y="210" width="50" height="50" fill="#0A0A0F" opacity="0.8" rx="3"/>
  <rect x="470" y="210" width="50" height="50" fill="#0A0A0F" opacity="0.8" rx="3"/>
  
  <!-- Backyard/yard representation -->
  <rect x="150" y="360" width="500" height="100" fill="#16A34A" opacity="0.2" rx="10"/>
  
  <!-- Small rental units -->
  <rect x="180" y="380" width="80" height="60" fill="#22C55E" opacity="0.6" rx="5"/>
  <rect x="195" y="400" width="20" height="40" fill="#0A0A0F" rx="2"/>
  
  <rect x="520" y="380" width="80" height="60" fill="#22C55E" opacity="0.6" rx="5"/>
  <rect x="535" y="400" width="20" height="40" fill="#0A0A0F" rx="2"/>
  
  <!-- For Rent signs -->
  <rect x="270" y="390" width="60" height="25" fill="#F97316" rx="3"/>
  <text x="300" y="408" font-family="Arial" font-size="10" fill="white" text-anchor="middle">FOR RENT</text>
  
  <rect x="470" y="390" width="60" height="25" fill="#F97316" rx="3"/>
  <text x="500" y="408" font-family="Arial" font-size="10" fill="white" text-anchor="middle">FOR RENT</text>
  
  <!-- Connection lines representing platform -->
  <line x1="220" y1="410" x2="270" y2="402" stroke="#22C55E" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="530" y1="402" x2="580" y2="410" stroke="#22C55E" stroke-width="2" stroke-dasharray="5,3"/>
  
  <!-- Mobile/Digital indicator -->
  <rect x="360" y="400" width="80" height="50" rx="8" fill="#1E1E2A" stroke="#22C55E" stroke-width="2"/>
  <rect x="370" y="410" width="60" height="30" fill="#22C55E" opacity="0.3" rx="3"/>
  <circle cx="400" y="445" r="5" fill="#22C55E"/>
  
  <!-- Location pins -->
  <circle cx="220" cy="320" r="15" fill="#F97316"/>
  <circle cx="220" cy="315" r="5" fill="white"/>
  <polygon points="220,335 212,320 228,320" fill="#F97316"/>
  
  <circle cx="580" cy="320" r="15" fill="#F97316"/>
  <circle cx="580" cy="315" r="5" fill="white"/>
  <polygon points="580,335 572,320 588,320" fill="#F97316"/>
  
  <text x="400" y="500" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">My-Yard</text>
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8" text-anchor="middle">Rental Management Platform</text>
</svg>