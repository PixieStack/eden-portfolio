<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bgPortfolio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="orangePurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgPortfolio)"/>
  
  <!-- Browser window frame -->
  <rect x="100" y="80" width="600" height="400" rx="15" fill="#1E1E2A" stroke="#F97316" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <rect x="100" y="80" width="600" height="40" rx="15" fill="#2A2A35"/>
  <circle cx="130" cy="100" r="8" fill="#FF5F57"/>
  <circle cx="155" cy="100" r="8" fill="#FEBC2E"/>
  <circle cx="180" cy="100" r="8" fill="#28C840"/>
  <rect x="250" y="90" width="300" height="20" rx="10" fill="#1E1E2A"/>
  <text x="400" y="105" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">pixiestack.github.io/porfolio</text>
  
  <!-- Navigation bar -->
  <rect x="120" y="135" width="560" height="35" fill="#16161D" rx="5"/>
  <circle cx="145" cy="152" r="12" fill="url(#orangePurple)"/>
  <text x="145" y="157" font-family="Arial Black" font-size="12" fill="white" text-anchor="middle">T</text>
  <rect x="200" y="145" width="50" height="15" rx="7" fill="#F97316"/>
  <rect x="260" y="147" width="40" height="10" rx="5" fill="#64748b" opacity="0.5"/>
  <rect x="310" y="147" width="35" height="10" rx="5" fill="#64748b" opacity="0.5"/>
  <rect x="355" y="147" width="45" height="10" rx="5" fill="#64748b" opacity="0.5"/>
  
  <!-- Hero section content -->
  <rect x="140" y="190" width="100" height="12" rx="6" fill="#F97316" opacity="0.3"/>
  <rect x="140" y="215" width="200" height="25" rx="5" fill="url(#orangePurple)"/>
  <rect x="140" y="250" width="250" height="15" rx="5" fill="#64748b" opacity="0.5"/>
  <rect x="140" y="275" width="220" height="10" rx="5" fill="#64748b" opacity="0.3"/>
  <rect x="140" y="295" width="180" height="10" rx="5" fill="#64748b" opacity="0.3"/>
  
  <!-- Profile circle placeholder -->
  <circle cx="550" cy="280" r="80" fill="url(#orangePurple)" opacity="0.3"/>
  <circle cx="550" cy="280" r="70" fill="#2A2A35"/>
  <circle cx="590" cy="220" r="15" fill="#F97316"/>
  <circle cx="500" cy="260" r="12" fill="#C084FC"/>
  
  <!-- CTA buttons -->
  <rect x="140" y="330" width="100" height="30" rx="15" fill="url(#orangePurple)"/>
  <rect x="255" y="330" width="80" height="30" rx="15" fill="none" stroke="#F97316" stroke-width="2"/>
  
  <!-- Stats section hint -->
  <rect x="140" y="400" width="520" height="50" rx="10" fill="#16161D"/>
  <rect x="180" y="415" width="60" height="20" rx="5" fill="url(#orangePurple)" opacity="0.5"/>
  <rect x="320" y="415" width="60" height="20" rx="5" fill="url(#orangePurple)" opacity="0.5"/>
  <rect x="460" y="415" width="60" height="20" rx="5" fill="url(#orangePurple)" opacity="0.5"/>
  
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Developer Portfolio</text>
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">Personal Portfolio Website</text>
</svg>